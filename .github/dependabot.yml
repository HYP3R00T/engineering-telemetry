version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: friday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - ci
  commit-message:
    prefix: chore(deps)
  groups:
    safe-patch-updates:
      patterns:
      - '*'
      update-types:
      - patch
    minor-updates:
      patterns:
      - '*'
      update-types:
      - minor
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: friday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - python
  commit-message:
    prefix: chore(deps)
  groups:
    safe-patch-updates:
      patterns:
      - '*'
      update-types:
      - patch
    minor-updates:
      patterns:
      - '*'
      update-types:
      - minor
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
